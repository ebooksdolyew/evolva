<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 51" role="img" aria-label="CRIATIVIDADE QUE VAI DO POST" preserveAspectRatio="xMidYMid meet">
  <title>CRIATIVIDADE QUE VAI DO POST</title>
  <!-- Linha branca da hero: uma linha só de texto em MuseoModerno Light
       (300), caixa alta, corpo 50 do viewBox, entreletra 0,045em,
       centralizada pelo text-anchor. Como este arquivo entra na pagina
       por <img>, um SVG externo nao pode buscar fonte na rede: a
       MuseoModerno 300 (subconjunto latin) vem embutida em woff2
       base64 no @font-face abaixo, para o desenho nao cair em fallback.
       O seletor .hero-top-line e so desta linha e nao alcanca nenhum
       outro texto. So este titulo mora aqui. -->
  <defs>
    <style type="text/css"><![CDATA[
      @font-face {
        font-family: 'MuseoModerno';
        font-style: normal;
        font-weight: 300;
        src: url(data:font/woff2;base64,) format('woff2');
      }
      .hero-top-line {
        font-family: 'MuseoModerno', sans-serif;
        font-weight: 300;
        font-style: normal;
        font-size: 50px;
        letter-spacing: 0.045em;
        font-synthesis: none;
        fill: #ffffff;
        stroke: none;
        text-anchor: middle;
      }
    ]]></style>
  </defs>
  <text class="hero-top-line" x="50%" y="39">CRIATIVIDADE QUE VAI DO POST</text>
</svg>
